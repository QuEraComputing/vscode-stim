name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # fetch the wasm engine stored in Git LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build extension
        run: npm run build

      - name: Grammar tests
        run: npm run test:grammar

      - name: WASM engine smoke tests
        run: npm run test:wasm

      - name: Engine + tsim tests
        run: npm run test:engine

      - name: Package (smoke)
        run: npx @vscode/vsce package -o stim-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: stim-vscode.vsix

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # extester skips the downloads when the unpacked binaries match the
      # pinned versions.
      - name: Cache VS Code and ChromeDriver
        uses: actions/cache@v4
        with:
          path: |
            .ui-tests/VSCode-*
            .ui-tests/chromedriver-*
          key: extester-${{ runner.os }}-${{ hashFiles('extester.config.json') }}

      - name: Real VS Code UI tests
        run: xvfb-run -a npm run test:ui

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ui-tests/screenshots/**
            .ui-tests/diagnostics/**
            .ui-tests/logs/**
            .ui-tests/settings/logs/**
            .ui-tests/*.log
